# Cloudflare Worker Configuration for CardDAV CORS Proxy
#
# Setup instructions:
# 1. Install Wrangler: npm install -g wrangler
# 2. Login: wrangler login
# 3. Deploy: wrangler deploy
# 4. Configure route in Cloudflare dashboard

name = "carddav-proxy"
main = "carddav-proxy.js"
compatibility_date = "2024-11-22"

# Default configuration (for testing)
[vars]
ALLOWED_ORIGINS = "https://e2econtacts.org,https://www.e2econtacts.org,http://localhost:8080,http://localhost:3000,http://localhost,http://127.0.0.1:8080,http://127.0.0.1:3000,http://127.0.0.1"

# Routes (configure in Cloudflare dashboard)
# Route pattern: your-domain.com/api/carddav/*
# Zone: your-domain.com
# Worker: carddav-proxy
